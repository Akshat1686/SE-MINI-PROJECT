# Sprint metrics: redrawn whenever a backlog issue is closed or reopened, and on demand.
# The charts are committed to docs/sprint-metrics/ (browsable in the repo), shown on
# the run's summary page, and kept as the "burndown" artifact.
name: Burndown

on:
  issues:
    types: [closed, reopened, milestoned, labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

# Issue events can fire in quick succession; run them one at a time so the
# commit-back pushes below never race each other.
concurrency:
  group: sprint-metrics
  cancel-in-progress: false

jobs:
  burndown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install matplotlib==3.10.7
      - name: Draw the charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/burndown.py docs/sprint-metrics
      - name: Show the tables on the summary page
        run: cat docs/sprint-metrics/burndown.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sprint-metrics
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update sprint metrics (burndown, velocity, retrospectives)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: burndown
          path: docs/sprint-metrics/
